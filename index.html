<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors!</title>
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="resultHolder">
        <h1 id="result">Rock Paper Scissors</h2>
        <p id="playerText">Rock, Paper, or Scissors...?</p>
        <p id="computerText">Click a button below to begin!</p>
        <p>Player Score: <span id="humanWins">0</span></p>
        <p>Computer Score: <span id="computerWins">0</span></p>
    </div>

    <div id="buttonHolder">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    
</body>
</html>
